<div class="product-card" style="
    border:1px solid #ddd;
    padding:16px;
    border-radius:8px;
    margin:16px 0;
">
    <h3>{{ .Get "name" }}</h3>

    {{ if .Get "image" }}
    <img src="{{ .Get "image" }}" alt="{{ .Get "name" }}" style="
        max-width:160px;
        border-radius:6px;
        margin:12px 0;
    ">
    {{ end }}

    <p>가격: <strong>{{ .Get "price" }}원</strong></p>

    <a href="{{ .Get "link" }}" target="_blank" style="
        display:inline-block;
        padding:8px 12px;
        background:#007bff;
        color:#fff;
        text-decoration:none;
        border-radius:4px;
        margin-top:8px;
    ">구매하러 가기 →</a>
</div>
